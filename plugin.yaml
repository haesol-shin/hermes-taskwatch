name: hermes-taskwatch
version: 0.0.0
description: Watch delegated Kanban work and block unchecked results from moving on.
author: haesol-shin
kind: standalone
requires_hermes: ">=0.21.5"
platforms:
  - linux
provides_hooks:
  - on_kanban_dispatch_tick
  - pre_tool_call
provides_tools:
  - taskwatch_create
  - taskwatch_reject
