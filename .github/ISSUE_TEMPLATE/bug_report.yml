name: Bug report
description: Something did not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What you were trying to do
      description: The task you delegated or the command you ran, and why.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `taskwatch ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output or logs
      description: Remove tokens, chat ids, and personal paths before you paste.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: hermes-taskwatch 0.1.0, Python 3.12
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
    validations:
      required: true
