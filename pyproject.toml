[project]
name = "hermes-taskwatch"
version = "0.0.0"
description = "Hermes Agent Kanban plugin: delegate and walk away. Nothing gets dropped, nothing unchecked gets through."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/haesol-shin/hermes-taskwatch"
Changelog = "https://github.com/haesol-shin/hermes-taskwatch/blob/main/CHANGELOG.md"
Issues = "https://github.com/haesol-shin/hermes-taskwatch/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
